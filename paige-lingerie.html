/* ===== events ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(e.target===ov)return close();if(!b)return;const a=b.dataset.act,d=b.dataset;
 if(a=='nav'){const o=$('#nav').classList.toggle('o');b.setAttribute('aria-expanded',o)}
 else if(a=='close')close();else if(a=='cart'){drawCart();$('#cart').classList.add('o')}else if(a=='cc')$('#cart').classList.remove('o');
 else if(a=='w')togW(d.id);else if(a=='more'){S.n+=6;shopList()}
 else if(a=='qv'){const p=pid(d.id);open(`<div class="qvg"><img src="${IMG[p.img]}" alt="${esc(p.name)}" style="width:100%;aspect-ratio:4/5;object-fit:cover"><div><h2 style="font-size:2rem">${p.name}</h2><p style="font-size:1.3rem;margin:8px 0">${money(p.price)}</p><p>${p.d}</p><p class="mut">Adds ${p.colors[0]}, size ${p.sizes[0]}. Choose other options on the product page.</p><button class="btn" data-act="qa" data-id="${p.id}" style="width:100%;margin-bottom:8px">Add to cart</button><a class="btn alt" style="width:100%" href="#/p/${p.id}">Full details</a></div></div>`)}
 else if(a=='qa'){const p=pid(d.id);addCart(p.id,p.sizes[0],p.colors[0],1,b);close();$('#cart').classList.add('o')}
 else if(a=='col'||a=='sz'){$$(`[data-act=${a}]`).forEach(x=>x.setAttribute('aria-pressed',x==b));sel[a=='col'?'color':'size']=d.v;$(a=='col'?'#cn':'#sn').textContent=d.v}
 else if(a=='pq'){sel.q=Math.min(10,Math.max(1,sel.q+ +d.d));$('#pqv').textContent=sel.q;const t=money(pid(sel.id).price*sel.q);$('#pp').textContent=t;$('#sp').textContent=t}
 else if(a=='addp'){addCart(sel.id,sel.size,sel.color,sel.q,b);$('#cart').classList.add('o')}
 else if(a=='lq'){const l=cart[d.i];l.q+=+d.d;if(l.q<1)cart.splice(d.i,1);drawCart()}else if(a=='rm'){cart.splice(d.i,1);drawCart()}
 else if(a=='sg')open(`<h2 style="margin-bottom:16px">Size guide</h2>${sizeTable()}`)
 else if(a=='acct')open(`<h2 style="margin-bottom:12px">Your wishlist</h2><p class="note">Customer accounts need a backend. Your saved pieces are kept on this device.</p><div style="margin-top:20px">${grid(wish.map(pid).filter(Boolean),'c3')}</div>`)
 else if(a=='search')open(`<h2 style="margin-bottom:12px">Search</h2><form data-form="sr"><input id="sq" type="search" placeholder="Search bras, sets, robes" aria-label="Search" autocomplete="off"></form><div id="sres" style="margin-top:20px"></div>`),$('#sq').focus();
 else if(a=='wa'){const s=summary();open(`<p>Opening WhatsApp…</p>`);close()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){close();$('#cart').classList.remove('o')}});
document.addEventListener('input',e=>{const i=e.target;if(i.id=='sq'){const q=i.value.toLowerCase().trim();$('#sres').innerHTML=q?grid(P.filter(p=>(p.name+p.cat+p.colors).toLowerCase().includes(q)).slice(0,6),'c3'):''}
 else if(i.id=='fq'){S.q=i.value;S.n=6;shopList()}});
document.addEventListener('change',e=>{const i=e.target,m={fc:'cat',fs:'size',fl:'color',fo:'sort'}[i.id];if(m){S[m]=i.value;S.n=6;shopList()}if(i.id=='dm')drawOs()});
const bad=(i,m)=>{i.nextElementSibling.textContent=m;i.setAttribute('aria-invalid',!!m);return!m};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form,v=n=>f.elements[n]?f.elements[n].value.trim():'',em=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
 if(k=='nl'){const i=$('#ne',f);if(bad(i,em.test(i.value.trim())?'':'Enter a valid email address, like name@example.com.')){f.innerHTML='<p class="ok" style="color:inherit">Looks good. This demo form doesn’t send emails yet. Connect an email provider to collect sign-ups.</p>'}}
 else if(k=='dc'){const c=f.elements[0].value.trim().toUpperCase();if(!c){code='';drawCart()}else if(c==C.code){code=c;drawCart();toast(C.pct+'% discount applied')}else toast('That code isn’t valid')}
 else if(k=='sr'){S={...S,q:$('#sq').value,cat:'all',n:6};close();location.hash='#/shop';if(location.hash=='#/shop')go()}
 else if(k=='ct'){const r=[bad(f.n,v('n')?'':'Enter your name.'),bad(f.e,em.test(v('e'))?'':'Enter a valid email address.'),bad(f.m,v('m').length>9?'':'Write a message of at least 10 characters.')];if(r.every(Boolean))location.href=`mailto:${C.email}?subject=${encodeURIComponent('Message from '+v('n'))}&body=${encodeURIComponent(v('m')+'\n\n'+v('n')+' ('+v('e')+')')}`}
 else if(k=='co'){const ph=v('phone').replace(/[\s-]/g,''),r=[['name',v('name').length>1,'Enter your full name.'],['email',em.test(v('email')),'Enter a valid email address.'],['phone',/^(\+234|0)\d{10}$/.test(ph),'Enter a Nigerian number like 08160000000.'],['addr',v('addr').length>5,'Enter your delivery address.'],['city',!!v('city'),'Enter your city.'],['state',!!v('state'),'Enter your state.']].map(x=>bad(f.elements[x[0]],x[1]?'':x[2]));
  if(r.every(Boolean)){const s=summary(),msg=`New Paige order (demo checkout)\n${s.lines.join('\n')}\nDelivery: ${s.d[1]} ${money(s.ship)}\nTotal: ${money(s.grand)}\n\n${v('name')}, ${v('phone')}\n${v('addr')}, ${v('city')}, ${v('state')}`;
  $('#res').innerHTML=`<div class="note" style="margin-top:16px"><b>Demo checkout: no payment was taken and no order was placed.</b><p style="margin:8px 0 14px">Card payments go live once Paystack or Flutterwave and a backend are connected. Until then you can send this order to the store on WhatsApp.</p><a class="btn" href="https://wa.me/${C.wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send order on WhatsApp</a></div>`;$('#res').scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})}else{const x=$('[aria-invalid=true]',f);x&&x.focus()}}});
/* ===== boot ===== */
$('#lg').src=IMG.logoC;$('#fl').src=IMG.logoC;new MutationObserver(()=>$('#sc').classList.toggle('o',$('#cart').classList.contains('o'))).observe($('#cart'),{attributes:true,attributeFilter:['class']});$('#sc').onclick=()=>$('#cart').classList.remove('o');$('#ldi').src=IMG.emb;save();drawCart();go();
setTimeout(()=>$('#ld').classList.add('h'),RM?100:1400);
</script>
</body>
</html>
